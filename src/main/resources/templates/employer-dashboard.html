<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employer Dashboard - JobPortal</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="dashboard">
    <section class="profile-banner">
        <div>
            <p class="eyebrow">Employer workspace</p>
            <h1 th:text="${user.companyName ?: user.fullName}">Company</h1>
            <p><span th:text="${#lists.size(jobs)}">0</span> posted jobs - <span th:text="${applicationCount}">0</span> applications</p>
        </div>
        <div class="action-row">
            <a th:href="@{/employer/applicants}" class="wide-button inline secondary">Applicants</a>
            <a th:href="@{/employer/jobs/new}" class="wide-button inline">Post job</a>
        </div>
    </section>
    <section class="panel">
        <div class="section-heading compact-head">
            <h2>Posted jobs</h2>
            <input data-table-filter placeholder="Search posted jobs">
        </div>
        <table>
            <thead><tr><th>Title</th><th>Approval</th><th>Location</th><th>Experience</th><th>Salary</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="job : ${jobs}" data-filter-row>
                <td th:text="${job.title}">Title</td>
                <td><span class="status" th:classappend="${job.approvalStatus.name().toLowerCase()}" th:text="${job.approvalStatus}">PENDING</span></td>
                <td th:text="${job.location}">Location</td>
                <td th:text="${job.experience}">Experience</td>
                <td th:text="${job.salary}">Salary</td>
                <td class="table-actions">
                    <a th:href="@{/employer/jobs/{id}/edit(id=${job.id})}">Edit</a>
                    <form th:action="@{/employer/jobs/{id}/delete(id=${job.id})}" method="post">
                        <button data-confirm="Delete this job?" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
